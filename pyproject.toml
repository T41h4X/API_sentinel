[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-drift-detector"
version = "0.1.4"
description = "Asynchronous FastAPI/ASGI middleware for real-time OpenAPI schema drift detection, dynamic schema inference, and interactive telemetry dashboard"
readme = "README.md"
authors = [{ name = "API Sentinel Team" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.95.0",
    "starlette>=0.26.0",
    "genson>=1.2.2",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=1.10.0",
    "uvicorn>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]

[project.scripts]
api-drift-detector = "api_sentinel.cli:main"
api-drift = "api_sentinel.cli:main"
api-sentinel = "api_sentinel.cli:main"
sentinel = "api_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/T41h4X/API_sentinel"
Repository = "https://github.com/T41h4X/API_sentinel.git"
Issues = "https://github.com/T41h4X/API_sentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_sentinel*", "dashboard*"]

[tool.setuptools.package-data]
"api_sentinel" = ["templates/*", "static/*"]
"api_sentinel.dashboard" = ["templates/*", "static/*"]
"dashboard" = ["templates/*", "static/*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
