name: API Sentinel CI & Contract Check

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test-and-contract-check:
    name: Test & Contract Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Validate OpenAPI Specification
        run: |
          api-sentinel validate --spec openapi.yaml

      - name: Run CI/CD Contract Check
        run: |
          api-sentinel check --spec openapi.yaml --fail-on error
